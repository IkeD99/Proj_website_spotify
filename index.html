<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b62829b2ff.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>DevMusic</title>
</head>

<body>
    <header class="header">
        <div class="navbar">
            <div class="nav-logo">
                <i class="fa-brands fa-spotify"></i>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="What do you want to play?">
            </div>
            <div class="nav-links">
                <a href="#">Premium</a>
                <a href="#">Support</a>
                <a href="#">Download</a>
                <button>Log in</button>
                <button>Sign up</button>
            </div>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <div class="nav-library">
                <i class="fa-solid fa-book"></i>
                <p>Sua Biblioteca +</p>
            </div>
            <div class="nav-playlist">
                <h5>Crie sua Primeira Playlist</h5>
                <p>É fácil, vamos te ajudar!</p>
                <button class="nav-btn">Criar Playlist</button>
            </div>
            <div class="nav-podcast">
                <h5>Que tal Seguir um Podcast?</h5>
                <p>Avisaremos você sobre nossos episodios</p>
                <button class="nav-btn">Explore os Podcasts</button>
            </div>
            <div class="nav-footer">
                <a href="#">Legal</a>
                <a href="#">Centro de Privacidade</a>
                <a href="#">Política de Privacidade</a>
                <a href="#">Cookies</a>
                <a href="#">Sobre Anuncios</a>
                <a href="#">Acessibilidade</a>
            </div>
            <button class="nav-lang-btn">
                <i class="fa-solid fa-globe"></i>
                Português do Brasil
            </button>
        </nav>
        <main>
            <section class="content">
                <h2>Artistas Populares</h2>
                <div class="artists-grid"></div>

                <h2>Álbuns Populares</h2>
                <div class="albums-grid"></div>
            </section>
        </main>
    </div>
</body>
<script src="script.js"></script>

</html>
